<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>CloudPix — Night Flight v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&display=swap" rel="stylesheet" />
<style>
  :root { --sky: #04060d; --lamp: #ffc86b; --star: #8fb8ff; --text: #e8ecf6; --muted: #7f89a3; --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--sky); color: var(--text); font-family: 'Space Grotesk'; font-size: 14px; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  #stars { inset: auto; left: -30px; top: -30px; will-change: transform; }
  #sky { pointer-events: none; }
  #globe { cursor: grab; }
  #globe.drag { cursor: grabbing; }
  #globe.point { cursor: pointer; }
  button { font: inherit; color: inherit; }

  /* header: settings menu, brand, totals */
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 12; padding: max(18px, env(safe-area-inset-top)) 24px 0; display: flex; justify-content: space-between; pointer-events: none; }
  .lead { display: flex; gap: 14px; align-items: flex-start; }
  .menuBtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(127,137,163,.35); background: rgba(12,16,30,.6); display: grid; place-content: center; gap: 4px; cursor: pointer; transition: border-color .3s, background .3s; }
  .menuBtn span { display: block; width: 14px; height: 1.5px; background: var(--text); border-radius: 1px; transition: transform .4s var(--ease), opacity .3s; }
  .menuBtn:hover { border-color: rgba(255,200,107,.6); }
  .menuBtn.on span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
  .menuBtn.on span:nth-child(2) { opacity: 0; }
  .menuBtn.on span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; padding-top: 5px; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .sideRow { display: flex; gap: 14px; align-items: flex-start; }
  .totals { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.6; padding-top: 2px; }
  .gearBtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(127,137,163,.35); background: rgba(12,16,30,.6); cursor: pointer; font-size: 17px; line-height: 1; color: var(--text); transition: border-color .3s, transform .6s var(--ease); }
  .gearBtn:hover { border-color: rgba(255,200,107,.6); }
  .gearBtn.on { transform: rotate(90deg); border-color: rgba(255,200,107,.6); }
  .help { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.7; transition: opacity .4s; }
  .help b { color: var(--text); font-weight: 500; }
  .help.off { opacity: 0; }
  .totals b { color: var(--text); font-weight: 500; }
  .menu.settings { left: auto; right: 24px; }
  .menu { position: fixed; z-index: 13; left: 24px; top: calc(max(18px, env(safe-area-inset-top)) + 48px); width: 280px; padding: 18px 18px 8px; border-radius: 16px; background: rgba(12,16,30,.94); box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07); backdrop-filter: blur(10px); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .35s ease, transform .45s var(--ease); }
  .menu.on { opacity: 1; transform: none; pointer-events: auto; }
  .menu h4 { font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .menu label { display: block; margin-bottom: 16px; font-size: 13px; }
  .menu label div { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .menu output { color: var(--lamp); }
  .menu input[type=range] { width: 100%; accent-color: var(--lamp); cursor: pointer; }
  .menu .check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .menu .check input { accent-color: var(--lamp); width: 16px; height: 16px; }
  /* the main menu */
  .nav { padding: 12px 10px; width: 260px; }
  .nav .who { padding: 8px 10px 14px; border-bottom: 1px solid rgba(127,137,163,.18); margin-bottom: 6px; }
  .nav .who b { display: block; font-weight: 500; font-size: 15px; }
  .nav .who span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .house { width: 22px; height: 20px; flex: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .nav button.item .house { margin-left: auto; }
  .field textarea { display: block; width: 100%; margin-top: 6px; border-radius: 12px; border: 1px solid rgba(127,137,163,.35); background: rgba(4,6,13,.6); color: var(--text); font: inherit; font-size: 14px; letter-spacing: 0; padding: 11px 12px; resize: vertical; min-height: 70px; }
  .field textarea:focus { outline: none; border-color: rgba(255,200,107,.6); }
  .editpic { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; margin-top: 14px; display: block; }
  .nav button.item { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; background: none; border: 0; border-radius: 10px; padding: 10px; font-size: 14px; text-align: left; cursor: pointer; transition: background .25s, color .25s; }
  .nav button.item:hover { background: rgba(127,137,163,.14); color: var(--lamp); }
  .nav button.item small { color: var(--muted); font-size: 11px; }
  .nav button.primary { background: var(--lamp); color: #1a1406; font-weight: 500; justify-content: center; margin: 4px 0 8px; }
  .nav button.primary:hover { background: #ffd48a; color: #1a1406; }
  .nav hr { border: 0; border-top: 1px solid rgba(127,137,163,.18); margin: 6px 4px; }
  .nav p { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 6px 10px 4px; }

  /* forms: log in, a new trip, a new album */
  .modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(4,6,13,.78); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s ease; padding: 16px; }
  .modal.on { opacity: 1; pointer-events: auto; }
  .sheet { width: min(460px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #0c1122; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07); padding: 26px 26px 22px; transform: translateY(14px); transition: transform .5s var(--ease); user-select: text; -webkit-user-select: text; }
  .modal.on .sheet { transform: none; }
  .sheet h3 { font-family: 'Fraunces'; font-style: italic; font-weight: 300; font-size: 32px; line-height: 1.05; }
  .sheet .lead2 { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .field { display: block; margin-top: 16px; font-size: 12px; letter-spacing: .08em; color: var(--muted); position: relative; }
  .field input, .field select { display: block; width: 100%; margin-top: 6px; border-radius: 12px; border: 1px solid rgba(127,137,163,.35); background: rgba(4,6,13,.6); color: var(--text); font: inherit; font-size: 14px; letter-spacing: 0; padding: 11px 12px; }
  .field input:focus, .field select:focus { outline: none; border-color: rgba(255,200,107,.6); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 2; margin-top: 4px; background: #121a31; border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,.5); overflow: hidden; display: none; letter-spacing: 0; }
  .sugg.on { display: block; }
  .sugg button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; font-size: 14px; cursor: pointer; }
  .sugg button:hover, .sugg button.on { background: rgba(255,200,107,.12); }
  .sugg small { color: var(--muted); margin-left: 6px; }
  .drop { margin-top: 16px; border: 1px dashed rgba(127,137,163,.45); border-radius: 14px; padding: 18px; text-align: center; font-size: 13px; color: var(--muted); cursor: pointer; transition: border-color .3s, background .3s; }
  .drop:hover, .drop.over { border-color: rgba(255,200,107,.7); background: rgba(255,200,107,.05); color: var(--text); }
  .thumbs2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .thumbs2 img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; }
  .checks { margin-top: 8px; max-height: 190px; overflow-y: auto; border-radius: 12px; border: 1px solid rgba(127,137,163,.2); }
  .field .checks input { display: inline-block; width: 16px; height: 16px; margin: 0; padding: 0; flex: none; accent-color: var(--lamp); }
  .checks span { flex: 1; min-width: 0; }
  .checks small { flex: none; }
  .checks label { display: flex; gap: 10px; align-items: center; padding: 9px 12px; font-size: 13px; letter-spacing: 0; color: var(--text); cursor: pointer; }
  .checks label:hover { background: rgba(127,137,163,.1); }
  .checks small { color: var(--muted); margin-left: auto; }
  .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .btn { border: 1px solid rgba(127,137,163,.35); background: rgba(12,16,30,.7); color: var(--text); border-radius: 99px; padding: 9px 18px; font-size: 13px; cursor: pointer; transition: border-color .3s, background .3s; }
  .btn:hover { border-color: rgba(255,200,107,.6); }
  .btn.main { background: var(--lamp); border-color: var(--lamp); color: #1a1406; font-weight: 500; }
  .btn.main:disabled { opacity: .45; cursor: default; }
  .btn.star { border-color: rgba(143,184,255,.55); color: var(--star); }
  .btn.star:hover { background: rgba(143,184,255,.1); }
  .formNote { margin-top: 14px; font-size: 11px; color: var(--muted); }
  .btn.danger { border-color: rgba(255,120,110,.45); color: #ff9a8f; margin-right: auto; }
  .btn.danger.sure { background: rgba(255,120,110,.15); }
  .field.check2 { display: flex; gap: 10px; align-items: center; letter-spacing: 0; font-size: 14px; color: var(--text); cursor: pointer; }
  .field.check2 input { width: 16px; height: 16px; margin: 0; accent-color: var(--lamp); }
  .vdel { position: absolute; left: 10px; top: 10px; z-index: 2; border: 0; border-radius: 99px; padding: 5px 10px; font-size: 12px; background: rgba(4,6,13,.65); color: #fff; cursor: pointer; opacity: 0; transition: opacity .3s, background .3s; }
  .vpic:hover .vdel, .vdel.sure { opacity: 1; }
  .vdel.sure { background: rgba(200,70,60,.85); }
  /* coming home: the same quiet room for every trip */
  .homeslot { cursor: default; }
  .homeslot svg, .homecard svg { width: 100%; height: 100%; display: block; }
  .cz-f { transform-box: fill-box; transform-origin: 50% 100%; animation: czf 1.1s ease-in-out infinite alternate; }
  .cz-f2 { animation-duration: .8s; animation-delay: -.3s; }
  @keyframes czf { 0% { transform: scale(1, 1) skewX(0); } 50% { transform: scale(.96, 1.08) skewX(-4deg); } 100% { transform: scale(1.03, .94) skewX(3deg); } }
  .cz-s { animation: czs 3.2s ease-in-out infinite; opacity: 0; }
  .cz-s2 { animation-delay: 1.6s; }
  @keyframes czs { 0% { opacity: 0; transform: translateY(5px); } 35% { opacity: .75; } 100% { opacity: 0; transform: translateY(-9px); } }
  .cz-g { animation: czg 2.4s ease-in-out infinite alternate; }
  @keyframes czg { from { opacity: .8; } to { opacity: 1; } }

  /* left column: the place in focus; hidden while nothing is picked */
  .focus { position: fixed; left: 24px; top: 100px; z-index: 5; width: min(360px, 30vw); pointer-events: none; transition: opacity .7s ease, transform .7s ease; }
  .focus.hidden { opacity: 0; transform: translateX(-18px); }
  .focus.hidden * { pointer-events: none !important; }
  .years { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 46px; pointer-events: auto; }
  .years button { background: none; border: 0; padding: 2px 0; font-size: 12px; letter-spacing: .2em; color: var(--muted); border-bottom: 1px solid transparent; cursor: pointer; transition: color .5s, border-color .5s; }
  .years button:hover { color: var(--text); }
  .years button.cur { color: var(--lamp); border-color: var(--lamp); }

  /* albums: the current one in front; the previous and next peek out above and below on hover */
  .albums { position: relative; width: 100%; aspect-ratio: 3 / 2; pointer-events: auto; transition: opacity .4s ease; }
  .albums.swap { opacity: 0; }
  .card { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #0b1020; box-shadow: 0 24px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); cursor: pointer; transition: transform .7s var(--ease), opacity .6s ease, filter .6s ease, box-shadow .6s ease; }
  .card.cur { z-index: 3; }
  .card.prev, .card.next { z-index: 2; opacity: 0; filter: brightness(.6) saturate(.85); transform: scale(.9); box-shadow: 0 14px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,200,107,.3); }
  .card.far { z-index: 1; opacity: 0; transform: scale(.84); pointer-events: none; }
  .albums:hover .card.cur { transform: scale(1.012); box-shadow: 0 30px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,200,107,.35); }
  .albums:hover .card.prev { opacity: 1; transform: translateY(calc(-5% - 34px)) scale(.9); }
  .albums:hover .card.next { opacity: 1; transform: translateY(calc(5% + 34px)) scale(.9); }
  .albums:hover .card.prev:hover, .albums:hover .card.next:hover { filter: brightness(.85); }
  /* the edge of a neighbouring album carries its name */
  .pname { position: absolute; left: 14px; right: 14px; z-index: 2; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .4s; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  .card.prev .pname { top: 9px; opacity: 1; }
  .card.next .pname { bottom: 9px; opacity: 1; }
  .card.next .credit { opacity: 0; }
  /* the pictures drift a little after the cursor */
  .pan { position: absolute; inset: -16px; transform: translate(var(--px, 0px), var(--py, 0px)); transition: transform .9s var(--ease); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.02); transition: opacity 1.4s ease, transform 7s linear; }
  .card img.on { opacity: 1; transform: scale(1.08); }
  .card::before { content: ''; position: absolute; inset: 0 0 auto; height: 38%; z-index: 1; background: linear-gradient(rgba(4,6,13,.7), transparent); opacity: 0; transition: opacity .45s; pointer-events: none; }
  .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 60%, rgba(4,6,13,.6)); pointer-events: none; }
  .atitle { position: absolute; left: 14px; right: 14px; top: 11px; z-index: 2; font-family: 'Fraunces'; font-style: italic; font-weight: 500; font-size: 19px; line-height: 1.15; opacity: 0; transform: translateY(-6px); transition: opacity .45s ease, transform .45s var(--ease); pointer-events: none; }
  .atitle small { display: block; font-family: 'Space Grotesk'; font-style: normal; font-weight: 400; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lamp); margin-top: 3px; }
  .albums:hover .card.cur::before, .albums:hover .card.cur .atitle { opacity: 1; transform: none; }
  @media (hover: hover) { .albums:hover .card.cur .atitle { pointer-events: auto; cursor: pointer; } }
  .atitle:hover { color: var(--lamp); }
  .credit { position: absolute; left: 12px; bottom: 10px; right: 12px; z-index: 2; font-size: 10px; color: rgba(232,236,246,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { position: absolute; right: 12px; top: 12px; z-index: 2; font-size: 10px; letter-spacing: .14em; color: rgba(232,236,246,.75); opacity: 0; transition: opacity .45s; }
  .albums.multi:not(:hover) .card.cur .count { opacity: 1; }

  .caption { margin-top: 52px; transition: opacity .6s ease, transform .6s ease; }

  /* a year of albums, laid out as folders; a folder opens into its photos */
  .viewer { position: fixed; inset: 0; z-index: 25; background: rgba(4,6,13,.95); backdrop-filter: blur(8px); overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .5s ease; touch-action: pan-y; }
  .viewer.on { opacity: 1; pointer-events: auto; }
  .viewer.slow { transition: opacity 1.4s ease; }
  .vhead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: max(22px, env(safe-area-inset-top)) 32px 18px; background: rgba(4,6,13,.985); box-shadow: 0 18px 22px -6px rgba(4,6,13,.95); }
  .vhead { flex-direction: column; align-items: stretch; gap: 16px; }
  .vbar { display: flex; gap: 12px; align-items: center; }
  .vhead > div.vtext { min-width: 0; }
  .vtabs { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(12,16,30,.8); box-shadow: 0 0 0 1px rgba(127,137,163,.2); min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .vtabs button { background: none; border: 0; border-radius: 99px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--muted); transition: background .3s, color .3s; }
  .vtabs button:hover { color: var(--text); }
  .vtabs button.on { background: rgba(255,200,107,.15); color: var(--lamp); }
  .vacts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .vacts:empty { display: none; }
  .tripcard, .yearcard { position: relative; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; cursor: pointer; background: #0b1020; box-shadow: 0 18px 40px rgba(0,0,0,.5); transition: transform .5s var(--ease); }
  .tripcard:hover, .yearcard:hover { transform: translateY(-5px); }
  .tripcard img, .yearcard img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.4s var(--ease); }
  .tripcard:hover img, .yearcard:hover img { transform: scale(1.06); }
  .tripcard::after, .yearcard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(4,6,13,.88)); }
  .tripcard div, .yearcard div { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; }
  .tripcard b { display: block; font-family: 'Fraunces'; font-style: italic; font-weight: 500; font-size: 24px; line-height: 1.1; }
  .tripcard span, .yearcard span { display: block; margin-top: 5px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lamp); }
  .yearcard b { display: block; font-family: 'Fraunces'; font-style: italic; font-weight: 300; font-size: 54px; line-height: 1; }
  .newcard { aspect-ratio: 4 / 3; border-radius: 14px; border: 1px dashed rgba(255,200,107,.45); display: grid; place-content: center; text-align: center; gap: 6px; cursor: pointer; color: var(--lamp); transition: background .3s, transform .5s var(--ease); }
  .newcard:hover { background: rgba(255,200,107,.06); transform: translateY(-5px); }
  .newcard b { font-size: 34px; font-weight: 300; }
  .newcard span { font-size: 13px; }
  .vstop { grid-column: 1 / -1; display: flex; gap: 14px; align-items: baseline; margin: 10px 0 -14px; border-bottom: 1px solid rgba(255,200,107,.2); padding-bottom: 8px; }
  .vstop:first-child { margin-top: 0; }
  .vstop i { font-style: normal; font-size: 12px; letter-spacing: .2em; color: var(--muted); }
  .vstop b { font-family: 'Fraunces'; font-style: italic; font-weight: 300; font-size: 32px; color: var(--lamp); }
  .vstop span { font-size: 12px; color: var(--muted); }
  .homecard { position: relative; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .homecard svg { width: 100%; height: 100%; display: block; }
  .homecard div { position: absolute; left: 16px; right: 16px; bottom: 14px; }
  .homecard b { display: block; font-family: 'Fraunces'; font-style: italic; font-weight: 500; font-size: 24px; }
  .homecard span { display: block; margin-top: 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #ffe2b0; }
  .vsub { margin-top: 8px; font-size: 13px; color: var(--muted); max-width: 640px; line-height: 1.5; }
  .crumb { color: var(--lamp); }
  .crumbs i { font-style: normal; color: var(--muted); margin: 0 8px; }
  .vkick { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--lamp); }
  .vhead h2 { font-family: 'Fraunces'; font-style: italic; font-weight: 300; font-size: clamp(30px, 4vw, 52px); line-height: 1; margin-top: 6px; }
  .vback, .vx { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(127,137,163,.35); background: rgba(12,16,30,.7); cursor: pointer; font-size: 16px; transition: opacity .3s, border-color .3s; }
  .vback:hover, .vx:hover { border-color: rgba(255,200,107,.6); }
  .vback.off { display: none; }
  .vyear { grid-column: 1 / -1; font-family: 'Fraunces'; font-style: italic; font-weight: 300; font-size: 34px; color: var(--lamp); margin: 10px 0 -14px; border-bottom: 1px solid rgba(255,200,107,.2); padding-bottom: 8px; }
  .vyear:first-child { margin-top: 0; }
  .citycard { position: relative; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; cursor: pointer; background: #0b1020; box-shadow: 0 18px 40px rgba(0,0,0,.5); transition: transform .5s var(--ease); }
  .citycard:hover { transform: translateY(-5px); }
  .citycard img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.4s var(--ease); }
  .citycard:hover img { transform: scale(1.06); }
  .citycard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(4,6,13,.85)); }

  @media (max-width: 700px) {

</style>

<script>
const A = window.ATLAS;
const $ = (id) => document.getElementById(id);
const globe = $('globe'), starsC = $('stars'), skyC = $('sky');
const g = globe.getContext('2d'), sctx = starsC.getContext('2d'), kctx = skyC.getContext('2d');
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (x) => x * x * (3 - 2 * x);
const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);   // zero speed and acceleration at both ends
const vec = (lon, lat) => [Math.cos(lat * DEG) * Math.cos(lon * DEG), Math.cos(lat * DEG) * Math.sin(lon * DEG), Math.sin(lat * DEG)];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

$('helpOn').checked = pace.help; $('help').classList.toggle('off', !pace.help);

function renderMenu() {

// ---------- forms ----------
const modal = $('modal'), sheet = $('sheet');
function openModal(html, setup) {

// a city field: places already on the map first, then a built-in list of cities
function placeField(label, id) { return `<label class="field">${label}<input id="${id}" autocomplete="off" placeholder="Start typing a city" /><div class="sugg" id="${id}S"></div></label>`; }
function wirePlace(id, onPick, preset) {
  const inp = $(id), box = $(id + 'S'); let chosen = null, list = [];
  const show = () => {
    list = A.places(inp.value); box.innerHTML = '';

  inp.addEventListener('focus', show);

const homeOf = (p) => ({ name: p.name, country: p.country, lat: p.lat, lon: p.lon });

function openAccount() {

function openPhotoEdit(a, p) {

const pad2 = (n) => String(n).padStart(2, '0');
// home, or any city already on the map
const endOptions = () => `<option value="home">Home · ${esc(A.home().name)}</option>` + A.cities().slice().sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<option value="${c.key}">${esc(c.name)}, ${esc(c.country.name)}</option>`).join('');
function openTrip(j = null, preset = []) {
  if (!A.user()) return openLogin();

  openModal(`<h3>${j ? 'Edit trip' : 'New trip'}</h3><p class="lead2">A name, where it starts and ends, and the albums that belong to it.</p>

      box.appendChild(l);
    });
    const check = () => { $('fGo').disabled = !$('fName').value.trim(); };

function openAlbum(a = null, opts = {}) {
  if (!A.user()) return openLogin();
  const now = new Date(), realTrips = A.journeys().filter((x) => x.real), cur = a ? A.tripOf(a) : null;
  const tripId = a ? (cur ? cur.id : '') : opts.trip || '';
  const date = a ? `${a.year}-${pad2(a.month)}-${pad2(a.day)}` : `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  openModal(`<h3>${a ? 'Edit album' : 'New album'}</h3><p class="lead2">${a ? 'Change its name, place, date or trip.' : 'A place, a day, and the photos from it. A new place becomes a new light on the globe.'}</p>
    <label class="field">Title<input id="fName" placeholder="Rooftops at sunset" /></label>
    ${placeField('Place', 'fPlace')}
    <div class="row2"><label class="field">Date<input id="fDate" type="date" /></label><label class="field">Time<input id="fTime" type="time" /></label></div>

    ${a ? '' : '<div class="drop" id="fDrop">Drop photos here, or click to choose</div><div class="thumbs2" id="fThumbs"></div>'}
    <div class="acts">${a ? '<button class="btn danger" id="fDel">Delete album</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn main" id="fGo" disabled>${a ? 'Save' : 'Create album'}</button></div>`, () => {
    let place = null, files = [];
    $('fName').value = a ? a.title : ''; $('fDate').value = date; $('fTime').value = a ? a.time : '12:00';
    const check = () => { $('fGo').disabled = !($('fName').value.trim() && place && $('fDate').value); };
    ['fName', 'fDate'].forEach((id) => $(id).addEventListener('input', check));
    const preset = a ? { name: a.city.name, country: a.city.country.name, id: a.city.country.id, lat: a.city.lat, lon: a.city.lon, city: a.city } : opts.place;
    wirePlace('fPlace', (p) => { place = p; check(); }, preset);
    if (!a) dropZone($('fDrop'), (fs) => { files = files.concat(fs); $('fThumbs').innerHTML = files.map((f) => `<img src="${URL.createObjectURL(f)}" alt="">`).join(''); });
    $('fGo').onclick = async () => {

      const made = A.addAlbum(fields);

    if (a) confirmTwice($('fDel'), 'Delete it and its photos?', async () => { await A.deleteAlbum(a); closeModal(); afterChange(); if (viewerOn) back(); });

}
// a button that asks once before it does something that cannot be undone
function confirmTwice(btn, ask, fn) {
  const label = btn.textContent;
  btn.onclick = () => {
    if (!btn.classList.contains('sure')) { btn.classList.add('sure'); btn.textContent = ask; setTimeout(() => { btn.classList.remove('sure'); btn.textContent = label; }, 3000); return; }
    fn();
  };
}
function dropZone(el, onFiles) {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.hidden = true;
  el.appendChild(input);
  el.addEventListener('click', (e) => { if (e.target !== input) input.click(); });
  input.addEventListener('change', () => { onFiles([...input.files]); input.value = ''; });
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('over'); onFiles([...e.dataTransfer.files].filter((f) => f.type.startsWith('image/'))); });
}
function pickPhotos(onFiles) {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.addEventListener('change', () => { if (input.files.length) onFiles([...input.files]); });
  input.click();
}
// after something is added: the timeline, the globe and the open list catch up
function afterChange() {
  const cur = idx >= 0 ? trips[idx] : null;
  trips.splice(0, trips.length, ...A.trips());
  idx = cur ? trips.indexOf(cur) : -1;
  if (cur && idx < 0) deselect();
  buildTimeline();
  if (idx >= 0) { const c = trips[idx].city; album.city = null; buildAlbums(c); }
  updateTimeline(); updateTotals();
  if (viewerOn && stack.length) render(stack[stack.length - 1], true);
}

// ---------- drag, spin, zoom, tap ----------
const pointers = new Map();
let dragging = false, moved = false, pinch = null, lastMove = 0, samples = [], hoverCity = null, downAt = [0, 0], sx = 0, sy = 0;
const cityAt = (x, y) => {
  let best = null, bd = Infinity;
  for (const city of A.cities()) {
    if (!city._vis) continue;
    const d = Math.hypot(city._p[0] - x, city._p[1] - y);
    if (d < Math.max(14, city._r * .55) && d < bd) { bd = d; best = city; }
  }
  return best;
};
globe.addEventListener('pointerdown', (e) => {
  globe.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  downAt = [e.clientX, e.clientY];
  dragging = true; moved = false; samples = []; sx = sy = 0; globe.classList.add('drag');
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zTarget }; }
});
globe.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') mouse = [e.clientX, e.clientY];
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; zTarget = clamp(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, Z_MIN, Z_MAX); return; }
  // a real drag starts after 5 px: it stops any spin and lets go of the camera during a flight
  if (!moved && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) { moved = true; vx = vy = spin = 0; spinning = false; camTween = null; if (flight) flight.follow = false; }
  if (!moved) return;
  // turn about the screen axes, so the globe goes wherever the hand goes, over the poles too
  const k = 57.3 / R;   // degrees per pixel at the current size
  const dx = (e.clientX - prev[0]) * k, dy = (e.clientY - prev[1]) * k;
  turn(dx, dy); sx += dx; sy += dy;
  const now = performance.now(); lastMove = now;
  samples.push([now, sx, sy]); while (samples.length > 2 && now - samples[0][0] > 160) samples.shift();
});
const up = (e) => {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (pointers.size) return;
  dragging = false; globe.classList.remove('drag');
  // throw speed from the last ~160 ms of movement, in degrees per 60 Hz frame
  const now = performance.now();
  if (moved) {
    if (samples.length > 1 && now - lastMove < 220) {
      const [ta, xa, ya] = samples[0], [tb, xb, yb] = samples[samples.length - 1], dt = Math.max(tb - ta, 1);
      vx = clamp((xb - xa) / dt * 16.7, -6, 6); vy = clamp((yb - ya) / dt * 16.7, -6, 6);
      // a throw sets the Earth turning the same way; upside down, its axis turns the other way
      if (Math.hypot(vx, vy) > .12) {
        spinning = true;
        if (Math.abs(vx) > .05) spinDir = Math.sign(vx) * (Math.cos(gam * DEG) < 0 ? -1 : 1);
      }
    } else vx = vy = 0;
    // let go without a throw: the Earth still picks its turn back up, unless a place is in focus
    if (idx < 0) spinning = true;
  } else if (e.type === 'pointerup') tap(e.clientX, e.clientY);
};
globe.addEventListener('pointerup', up); globe.addEventListener('pointercancel', up);
globe.addEventListener('pointerleave', () => { mouse = null; hoverCity = null; globe.classList.remove('point'); });
globe.addEventListener('wheel', (e) => { e.preventDefault(); zTarget = clamp(zTarget * Math.exp(-e.deltaY * .0012), Z_MIN, Z_MAX); }, { passive: false });
function tap(x, y) {
  const best = cityAt(x, y);
  if (!best) return;
  stop();
  // prefer the city's album inside the chosen range
  const own = trips.map((_, i) => i).filter((i) => trips[i].city === best);
  // a light outside the trip or year being watched leaves it
  if (tour && !own.some((k) => tour.list.includes(k))) leaveTour();
  const i = (tour && own.find((k) => tour.list.includes(k))) ?? own.find((k) => inRange(trips[k])) ?? own[0];
  if (!(idx >= 0 && trips[idx].city === best && !flight)) flyTo(i);
}

// ---------- boot ----------
(async () => {
  await A.load();
  // albums added earlier in this browser join the demo ones
  trips.splice(0, trips.length, ...A.trips()); buildTimeline();
  const topo = await d3.json('/files/countries-110m.json');
  land = topojson.merge(topo, topo.objects.countries.geometries);

  updateTimeline(); updateTotals();

  window.__state = () => ({ z, tF, lam: +lam.toFixed(2), phi: +phi.toFixed(2), spin: +spin.toFixed(4), flight: !!flight, e: flight && +flight.e.toFixed(3), idx, album: album.cur, range, pending, paused: !!zoomed });
  window.__setZoom = (v) => { zTarget = v; };
})();
